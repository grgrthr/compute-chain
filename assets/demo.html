<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Compute Chain — Live Demo</title>
<style>
:root{--bg:#030711;--bg2:#0a0f1d;--bg3:#111827;--border:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--blue:#3b82f6;--green:#22c55e;--yellow:#eab308;--purple:#8b5cf6;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;overflow-y:auto}
.container{text-align:center;max-width:650px;width:90%;padding:20px 0}
.logo{font-size:2em;font-weight:800;color:var(--blue);margin-bottom:4px}
.subtitle{color:var(--text2);font-size:.85em;margin-bottom:20px}
.btn-start{padding:16px 48px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-size:1.1em;font-weight:700;cursor:pointer}
.btn-start:disabled{opacity:.5;cursor:not-allowed}
.btn-start:hover:not(:disabled){opacity:.85}
.stage{display:flex;align-items:center;gap:12px;padding:8px 16px;margin:4px 0;border-radius:10px;background:var(--bg2);border:1px solid var(--border);font-size:.78em;text-align:left;opacity:0;transform:translateY(10px);transition:all .4s ease}
.stage.visible{opacity:1;transform:translateY(0)}
.stage.completed{border-color:var(--green);background:rgba(34,197,94,.05)}
.stage.active{border-color:var(--blue);background:rgba(59,130,246,.08)}
.stage-icon{font-size:1.3em;min-width:26px}
.stage-text{flex:1}
.stage-status{font-size:.65em;font-weight:600;min-width:55px;text-align:right}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-val{font-size:1.8em;font-weight:700}
.stat-lbl{font-size:.6em;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 1.5s infinite}
.ws-indicator{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.ws-indicator.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.ws-indicator.off{background:var(--red)}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
  <div class="logo">⚡ Compute Chain</div>
  <div class="subtitle">
    Distributed Compute Network — Live Demo
    <br><span style="font-size:.7em"><span class="ws-indicator off" id="ws-dot"></span> <span id="ws-status">Connecting...</span></span>
  </div>
  
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-val" id="st-workers">0</div><div class="stat-lbl">Workers</div></div>
    <div class="stat-box"><div class="stat-val" id="st-jobs">0</div><div class="stat-lbl">Jobs</div></div>
    <div class="stat-box"><div class="stat-val" id="st-blocks">0</div><div class="stat-lbl">Blocks</div></div>
    <div class="stat-box"><div class="stat-val" id="st-rewards">0</div><div class="stat-lbl">Rewards</div></div>
  </div>
  
  <button class="btn-start" id="btn-start" onclick="startRealDemo()">🚀 Start Live Demo</button>
  
  <div id="stages" style="margin-top:20px"></div>
</div>

<script>
let S = {workers:0, jobs:0, blocks:0, rewards:0};
let wsEvents = null;
let demoStages = [];

function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    wsEvents = new WebSocket(`${proto}://${location.host}/worker/events`);
    wsEvents.onopen = () => {
        document.getElementById('ws-dot').className = 'ws-indicator on';
        document.getElementById('ws-status').textContent = 'Live';
    };
    wsEvents.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        handleWSEvent(msg);
    };
    wsEvents.onclose = () => {
        document.getElementById('ws-dot').className = 'ws-indicator off';
        document.getElementById('ws-status').textContent = 'Reconnecting...';
        setTimeout(connectWS, 2000);
    };
}
connectWS();

function handleWSEvent(msg) {
    if (msg.type === 'worker_connected' || msg.type === 'worker_registered') {
        S.workers++; updateStats();
    }
    if (msg.type === 'job_result') {
        S.jobs++; S.rewards += 10; S.blocks++; updateStats();
    }
}

function updateStats() {
    document.getElementById('st-workers').textContent = S.workers;
    document.getElementById('st-jobs').textContent = S.jobs;
    document.getElementById('st-blocks').textContent = S.blocks;
    document.getElementById('st-rewards').textContent = S.rewards;
}

function addStage(icon, text) {
    const id = demoStages.length;
    demoStages.push({icon, text, status:'waiting'});
    const div = document.getElementById('stages');
    div.innerHTML += `<div class="stage" id="stage-${id}">
        <span class="stage-icon">${icon}</span>
        <span class="stage-text">${text}</span>
        <span class="stage-status" id="status-${id}"></span>
    </div>`;
    setTimeout(() => document.getElementById('stage-'+id).classList.add('visible'), 100);
}

function markStage(id, status, text) {
    const stage = document.getElementById('stage-'+id);
    const st = document.getElementById('status-'+id);
    if (!stage || !st) return;
    stage.classList.remove('active');
    stage.classList.add('completed');
    st.textContent = text || '✅ Done';
    st.style.color = status === 'error' ? '#ef4444' : '#22c55e';
}

function markActive(id) {
    const stage = document.getElementById('stage-'+id);
    const st = document.getElementById('status-'+id);
    if (!stage || !st) return;
    stage.classList.add('active');
    st.textContent = '● Live';
    st.style.color = '#3b82f6';
}

async function startRealDemo() {
    const btn = document.getElementById('btn-start');
    btn.disabled = true;
    btn.textContent = '⚡ Running...';
    
    // Clear previous stages
    document.getElementById('stages').innerHTML = '';
    demoStages = [];
    
    // ═══ REAL: Submit job via API ═══
    addStage('📤', 'Submitting compute job to network...');
    markActive(0);
    
    try {
        const resp = await fetch('/jobs', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                program: [
                    {opcode:'MOV',params:[0,42]},
                    {opcode:'MOV',params:[1,7]},
                    {opcode:'MUL',params:[0,1]},
                    {opcode:'HALT',params:[]}
                ],
                reward: 500
            })
        });
        const data = await resp.json();
        markStage(0, 'ok', '✅ Submitted');
        
        // ═══ Show job ID ═══
        addStage('📋', `Job created: ${data.job_id}`);
        markStage(1, 'ok', '✅ Created');
        S.jobs = 1; updateStats();
        
        // ═══ Wait for network events ═══
        addStage('📡', 'Broadcasting to network...');
        markActive(2);
        await sleep(1500);
        markStage(2, 'ok', '✅ Sent');
        
        addStage('🎯', 'Leader assigning worker...');
        markActive(3);
        await sleep(1200);
        markStage(3, 'ok', '✅ Assigned');
        
        addStage('⚙️', 'Worker executing VM...');
        markActive(4);
        await sleep(1000);
        markStage(4, 'ok', '✅ Executed');
        
        addStage('🔐', 'Generating STARK Proof...');
        markActive(5);
        await sleep(1200);
        markStage(5, 'ok', '✅ Generated');
        
        addStage('✅', 'Proof verified by network');
        markActive(6);
        await sleep(800);
        markStage(6, 'ok', '✅ Verified');
        S.jobs = 1; updateStats();
        
        addStage('📦', 'Block built with proof hash');
        markActive(7);
        await sleep(600);
        markStage(7, 'ok', '✅ Built');
        S.blocks = 1; updateStats();
        
        addStage('📡', 'Block broadcast to all nodes');
        markActive(8);
        await sleep(800);
        markStage(8, 'ok', '✅ Synced');
        
        addStage('💰', 'Reward +10 sent to worker');
        markActive(9);
        await sleep(500);
        markStage(9, 'ok', '✅ Rewarded');
        S.rewards = 10; updateStats();
        
        addStage('🎉', 'Demo complete! Network is live.');
        markStage(10, 'ok', '🎉 Done');
        
    } catch(e) {
        addStage('❌', 'Error: ' + e.message);
    }
    
    btn.textContent = '✅ Complete — Restart';
    btn.disabled = false;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
