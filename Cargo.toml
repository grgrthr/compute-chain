[package]
name = "compute_chain"
version = "0.98.0"
edition = "2021"

[dependencies]
base64 = "0.21"
lazy_static = "1.4"
sha2 = "0.10"
hex = "0.4"

winterfell = "0.6"
winter-utils = "0.6"
winter-air = "0.6"
winter-math = "0.6"

rand = "0.8"
uuid = { version = "1", features = ["v4"] }

axum = { version = "0.7", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

futures = "0.3"
futures-util = "0.3"

bincode = "1.3"

reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

libp2p = { version = "0.53", default-features = false, features = [
"tokio",
"tcp",
"noise",
"yamux",
"ping",
"identify",
"kad",
"gossipsub",
"dns",
"macros",
"mdns"
] }

ocl = { version = "0.19", optional = true }
bytemuck = { version = "1", optional = true }

tokio-tungstenite = "0.21"

num_cpus = "1"

tracing = "0.1"
tracing-subscriber = "0.3"

ed25519-dalek = "2"

[features]
default = []
gpu = ["ocl", "bytemuck"]
